python - <<'PY'
from pathlib import Path

p = Path("profile/airootfs/root/customize_airootfs.sh")
s = p.read_text()

old = """AUR_DIR=/root/aur-packages

if compgen -G "$AUR_DIR/*.pkg.tar.zst" >/dev/null; then
  pacman -U --noconfirm "$AUR_DIR"/*.pkg.tar.zst
fi
"""

new = """AUR_DIR=/root/aur-packages

# Pacman can fail its filesystem space check inside the archiso chroot
# because the airootfs is not mounted as a normal filesystem during
# customization. Keep integrity/conflict checks enabled, but disable
# only the CheckSpace pre-transaction check.
sed -i -E 's/^[[:space:]]*CheckSpace/#CheckSpace/' /etc/pacman.conf

if compgen -G "$AUR_DIR/*.pkg.tar.zst" >/dev/null; then
  pacman -U --noconfirm "$AUR_DIR"/*.pkg.tar.zst
fi
"""

if old not in s:
    raise SystemExit("Expected block was not found; file was not changed.")

p.write_text(s.replace(old, new))
PY

git add profile/airootfs/root/customize_airootfs.sh
git commit -m "Fix pacman space check in ISO customization"
git push
