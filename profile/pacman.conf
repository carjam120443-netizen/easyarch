#
# EasyArch pacman.conf
#
# Based on the current Archiso releng profile.

[options]
HoldPkg     = pacman glibc
Architecture = auto
# We cannot check disk space from within the archiso chroot.
#CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR provides prebuilt packages from the AUR.
# The keyring and mirrorlist packages are included in EasyArch and installed
# before this repository is used.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

# If you want to run 32-bit applications on x86_64, enable multilib.
#[multilib]
#Include = /etc/pacman.d/mirrorlist
